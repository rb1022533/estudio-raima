            <circle cx="9" cy="-3" r="8" fill="url(#flower)"></circle>
            <circle cx="6" cy="8" r="8" fill="url(#flower)"></circle>
            <circle cx="-6" cy="8" r="8" fill="url(#flower)"></circle>
            <circle cx="-9" cy="-3" r="8" fill="url(#flower)"></circle>

