            <circle cx="5" cy="7" r="7" fill="url(#flower)"></circle>
            <circle cx="-5" cy="7" r="7" fill="url(#flower)"></circle>
            <circle cx="-8" cy="-3" r="7" fill="url(#flower)"></circle>

            <circle cx="0" cy="0" r="3.5" fill="#A8B5A2"></circle>

