<svg viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">

    <defs>

        <!-- Sombra -->
        <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="4" dy="7" stdDeviation="6" flood-color="#6F625B" flood-opacity="0.20"></feDropShadow>
        </filter>

        <!-- Desenfoque muy suave -->
        <filter id="softBlur">
            <feGaussianBlur stdDeviation="1.4"></feGaussianBlur>
        </filter>

        <!-- Gradiente de las flores -->
        <radialGradient id="flower" cx="45%" cy="40%">

            <stop offset="0%" stop-color="#F0E5DC"></stop>

            <stop offset="65%" stop-color="#DFCBC0"></stop>

            <stop offset="100%" stop-color="#CBAFA3"></stop>

        </radialGradient>

    </defs>


    <!-- ================================================= -->
    <!-- RAMA -->
    <!-- ================================================= -->

    <g filter="url(#shadow)">

        <!-- Tallo principal -->
        <path d="
                M65 650
                C100 590 115 520 145 440
                C175 360 210 300 255 235
                C290 180 320 120 345 60
            " fill="none" stroke="#6F625B" stroke-width="7" stroke-linecap="round"></path>


        <!-- Rama superior -->
        <path d="
                M255 235
                C235 195 225 155 235 115
            " fill="none" stroke="#6F625B" stroke-width="4.5" stroke-linecap="round"></path>


        <!-- Rama superior derecha -->
        <path d="
                M295 170
                C320 145 340 125 365 115
            " fill="none" stroke="#6F625B" stroke-width="4" stroke-linecap="round"></path>


        <!-- Rama izquierda -->
        <path d="
                M170 370
                C130 345 95 315 75 275
            " fill="none" stroke="#6F625B" stroke-width="4.5" stroke-linecap="round"></path>


        <!-- Rama izquierda secundaria -->
        <path d="
                M135 435
                C100 415 70 390 55 355
            " fill="none" stroke="#6F625B" stroke-width="4" stroke-linecap="round"></path>


        <!-- Rama inferior -->
        <path d="
                M105 535
                C75 505 55 475 55 440
            " fill="none" stroke="#6F625B" stroke-width="4" stroke-linecap="round"></path>


        <!-- Ramita central -->
        <path d="
                M215 300
                C195 270 180 250 165 225
            " fill="none" stroke="#6F625B" stroke-width="3" stroke-linecap="round"></path>


        <!-- Ramita central derecha -->
        <path d="
                M190 340
                C215 320 235 305 250 285
            " fill="none" stroke="#6F625B" stroke-width="3" stroke-linecap="round"></path>


        <!-- ================================================= -->
        <!-- HOJAS VERDES -->
        <!-- ================================================= -->

        <g fill="#A8B5A2">

            <!-- Parte superior -->

            <ellipse cx="305" cy="145" rx="16" ry="7" transform="rotate(-48 305 145)"></ellipse>

            <ellipse cx="280" cy="205" rx="17" ry="7" transform="rotate(35 280 205)"></ellipse>

            <ellipse cx="220" cy="175" rx="15" ry="7" transform="rotate(-55 220 175)"></ellipse>


            <!-- Zona central -->

            <ellipse cx="225" cy="250" rx="17" ry="7" transform="rotate(35 225 250)"></ellipse>

            <ellipse cx="180" cy="285" rx="15" ry="7" transform="rotate(-45 180 285)"></ellipse>

            <ellipse cx="145" cy="335" rx="17" ry="7" transform="rotate(35 145 335)"></ellipse>

            <ellipse cx="195" cy="365" rx="15" ry="7" transform="rotate(-35 195 365)"></ellipse>


            <!-- Rama izquierda -->

            <ellipse cx="105" cy="315" rx="17" ry="7" transform="rotate(-40 105 315)"></ellipse>

            <ellipse cx="80" cy="350" rx="15" ry="7" transform="rotate(40 80 350)"></ellipse>

            <ellipse cx="95" cy="395" rx="17" ry="7" transform="rotate(-35 95 395)"></ellipse>


            <!-- Parte inferior -->

