            <circle cx="0" cy="-8" r="7" fill="url(#flower)"></circle>
            <circle cx="8" cy="-3" r="7" fill="url(#flower)"></circle>
            <circle cx="5" cy="7" r="7" fill="url(#flower)"></circle>
            <circle cx="-5" cy="7" r="7" fill="url(#flower)"></circle>
            <circle cx="-8" cy="-3" r="7" fill="url(#flower)"></circle>

            <circle cx="0" cy="0" r="3.5" fill="#A8B5A2"></circle>

        </g>


        <!-- Flor 8 -->
        <g transform="translate(55 440)">

            <circle cx="0" cy="-8" r="7" fill="url(#flower)"></circle>
            <circle cx="8" cy="-3" r="7" fill="url(#flower)"></circle>
            <circle cx="5" cy="7" r="7" fill="url(#flower)"></circle>
            <circle cx="-5" cy="7" r="7" fill="url(#flower)"></circle>
            <circle cx="-8" cy="-3" r="7" fill="url(#flower)"></circle>

            <circle cx="0" cy="0" r="3.5" fill="#A8B5A2"></circle>

        </g>


        <!-- Flor 9 -->
        <g transform="translate(205 335)">

            <circle cx="0" cy="-7" r="6.5" fill="url(#flower)"></circle>
            <circle cx="7" cy="-2" r="6.5" fill="url(#flower)"></circle>
            <circle cx="4" cy="6" r="6.5" fill="url(#flower)"></circle>
            <circle cx="-4" cy="6" r="6.5" fill="url(#flower)"></circle>
            <circle cx="-7" cy="-2" r="6.5" fill="url(#flower)"></circle>

            <circle cx="0" cy="0" r="3" fill="#A8B5A2"></circle>

        </g>


        <!-- ================================================= -->
        <!-- PEQUEÑOS CAPULLOS -->
        <!-- ================================================= -->

        <g fill="#D9C5B8">

            <circle cx="285" cy="190" r="5"></circle>
            <circle cx="325" cy="145" r="4"></circle>
            <circle cx="190" cy="250" r="4"></circle>
            <circle cx="125" cy="350" r="5"></circle>
            <circle cx="85" cy="425" r="4"></circle>

        </g>

    </g>

</svg>